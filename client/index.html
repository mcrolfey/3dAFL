<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3dAFL</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="audio-controls">
          <button id="sound-btn">Enable sound</button>
          <button id="commentary-btn">Commentary: On</button>
          <button id="stats-btn">Stats: Off</button>
          <button id="camera-btn">Camera: Auto</button>
          <button id="pace-btn" title="Switch between real time and the normal quicker pace">Pace: 4×</button>
        </div>

        <div id="stats-panel" class="hidden">
          <div class="stats-tabs">
            <button class="stats-tab">Home</button>
            <button class="stats-tab">Away</button>
          </div>
          <div id="stats-summary"></div>
          <div class="stats-scroll">
            <table id="stats-table">
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div id="scoreboard">
          <div class="team home">
            <span class="team-name" id="home-name">Home</span>
            <span class="team-score" id="home-score">0.0.0</span>
          </div>
          <div class="clock">
            <span id="quarter">Q1</span>
            <span id="time">20:00</span>
          </div>
          <div class="team away">
            <span class="team-score" id="away-score">0.0.0</span>
            <span class="team-name" id="away-name">Away</span>
          </div>
        </div>

        <div id="commentary-feed"></div>

        <div id="carrier-tag" class="hidden">
          <span id="carrier-number"></span>
          <div>
            <div id="carrier-name"></div>
            <div id="carrier-team"></div>
          </div>
        </div>

        <div id="controls">
          <button id="start-btn">Start Match</button>
        </div>

        <div id="ladder-panel">
          <h3 id="ladder-title">Ladder</h3>
          <table id="ladder-table"></table>
        </div>

        <div id="fulltime-banner" class="hidden">
          <div id="fulltime-text"></div>
          <button id="next-match-btn">Watch Next Match</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
